<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CONFLICT·TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Mono:wght@400;700&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#000;--s1:#0a0a0a;--s2:#111;
  --b0:rgba(255,255,255,.055);--b1:rgba(255,255,255,.10);--b2:rgba(255,255,255,.20);
  --t0:#fff;--t1:rgba(255,255,255,.52);--t2:rgba(255,255,255,.22);--t3:rgba(255,255,255,.09);
  --red:#ff2020;--r2:rgba(255,32,32,.07);
  --grn:#00e040;--g2:rgba(0,224,64,.06);
  --amb:#ff8c00;--a2:rgba(255,140,0,.07);
  --blu:#4488ff;
  --mono:'Share Tech Mono',monospace;
  --head:'Space Mono',monospace;
  --body:'Roboto Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t0);font-family:var(--body);}
button,input,select{font-family:inherit;}
::-webkit-scrollbar{width:2px;height:2px;}
::-webkit-scrollbar-thumb{background:var(--b1);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:4px 4px;}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.1}}
@keyframes fi-in{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
@keyframes brk{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes mrkPulse{0%,100%{opacity:1}50%{opacity:.12}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1;}

/* ── TOPBAR ── */
#topbar{
  height:40px;flex-shrink:0;background:rgba(0,0,0,.97);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:center;padding:0 14px;gap:8px;
  position:relative;z-index:200;
}
#logo{font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:4px;
  color:var(--t0);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.logo-sq{width:7px;height:7px;background:var(--red);flex-shrink:0;animation:pulse 2s ease infinite;}
.tb-div{width:1px;height:14px;background:var(--b1);flex-shrink:0;}
#clock{font-family:var(--mono);font-size:11px;color:var(--t2);letter-spacing:2px;
  padding:1px 7px;border:1px solid var(--b0);}
.live-badge{padding:2px 7px;border:1px solid rgba(255,32,32,.35);
  font-family:var(--mono);font-size:7px;letter-spacing:1.8px;
  color:var(--red);background:var(--r2);text-transform:uppercase;}
.live-badge span{display:inline-block;width:4px;height:4px;background:var(--red);
  margin-right:5px;animation:blink .8s step-end infinite;}
#tb-right{margin-left:auto;display:flex;align-items:center;gap:5px;}
.tb-btn{height:24px;padding:0 8px;background:transparent;border:1px solid var(--b1);
  color:var(--t2);font-size:8px;cursor:pointer;transition:all .1s;
  display:flex;align-items:center;gap:4px;
  font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase;}
.tb-btn:hover{background:var(--b0);border-color:var(--b2);color:var(--t0);}
.tb-btn svg{width:11px;height:11px;flex-shrink:0;}
.mod-pill{height:22px;padding:0 8px;background:transparent;border:1px solid var(--b0);
  color:var(--t2);font-size:7px;cursor:pointer;font-family:var(--mono);
  letter-spacing:1px;text-transform:uppercase;transition:all .1s;}
.mod-pill:hover{color:var(--t1);border-color:var(--b1);}
.mod-pill.on{background:var(--b1);border-color:var(--b2);color:var(--t0);}

/* Progress bar */
#prog{height:1px;flex-shrink:0;}
#prog-fill{height:100%;width:0;background:var(--t2);transition:width .2s;}
#prog.idle #prog-fill{opacity:0;transition:opacity .4s .1s;}

/* ── MAIN ── */
#main{flex:1;display:flex;min-height:0;overflow:hidden;}

/* ── MODULES ── */
.module{display:none;flex:1;min-height:0;overflow:hidden;}
.module.on{display:flex;}

/* ── COLUMN LAYOUT ── */
.col{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--b0);}
.col:last-child{border-right:none;}
.col-hdr{height:34px;flex-shrink:0;padding:0 11px;background:var(--bg);
  border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:7px;}
.col-title{font-family:var(--head);font-size:7px;font-weight:700;letter-spacing:3px;
  color:var(--t2);text-transform:uppercase;}
.col-badge{padding:0 5px;height:13px;line-height:13px;font-family:var(--mono);font-size:7px;
  background:var(--b0);color:var(--t2);margin-left:auto;letter-spacing:.5px;border:1px solid var(--b0);}
.col-status{font-family:var(--mono);font-size:7px;color:var(--t2);}
.ph-dot{width:5px;height:5px;background:var(--red);flex-shrink:0;animation:pulse 2.5s ease infinite;}

/* ── FILTER BAR ── */
.fbar{display:flex;gap:2px;padding:4px 9px;flex-shrink:0;
  border-bottom:1px solid var(--b0);background:var(--s1);overflow-x:auto;}
.fbar::-webkit-scrollbar{display:none;}
.fbtn{padding:2px 7px;background:transparent;border:1px solid var(--b0);
  color:var(--t2);font-size:7px;cursor:pointer;white-space:nowrap;transition:all .1s;
  font-family:var(--mono);letter-spacing:.8px;text-transform:uppercase;}
.fbtn:hover{border-color:var(--b1);color:var(--t1);}
.fbtn.on{background:var(--b1);border-color:var(--b2);color:var(--t0);}
.fbtn.hot.on{background:var(--r2);border-color:rgba(255,32,32,.3);color:var(--red);}

/* ── FEED ── */
.feed{flex:1;overflow-y:auto;min-height:0;}
.fstatus{padding:24px;text-align:center;color:var(--t2);font-size:9px;
  font-family:var(--mono);letter-spacing:.5px;line-height:2.2;}
.spin-sq{display:inline-block;width:4px;height:4px;background:var(--t2);
  animation:dot 1s steps(2) infinite;vertical-align:middle;margin-right:6px;}

.fitem{padding:8px 11px 7px;border-bottom:1px solid var(--b0);
  border-left:2px solid transparent;cursor:pointer;transition:background .06s;
  animation:fi-in .12s ease both;}
.fitem:hover{background:var(--s1);}
.fitem.read{opacity:.18;}
.fitem-top{display:flex;align-items:center;gap:4px;margin-bottom:4px;flex-wrap:wrap;}
.ftag{font-size:6px;font-weight:700;padding:1px 4px;letter-spacing:1.2px;
  text-transform:uppercase;font-family:var(--mono);border:1px solid;flex-shrink:0;}
.tag-r{color:var(--red);border-color:rgba(255,32,32,.25);background:var(--r2);}
.tag-o{color:var(--amb);border-color:rgba(255,140,0,.25);background:var(--a2);}
.tag-b{color:var(--blu);border-color:rgba(68,136,255,.2);background:rgba(68,136,255,.05);}
.tag-g{color:var(--grn);border-color:rgba(0,224,64,.2);background:var(--g2);}
.tag-n{color:var(--t1);border-color:var(--b1);background:var(--b0);}
.fsrc{font-size:7px;color:var(--t2);max-width:70px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);}
.ftime{margin-left:auto;font-size:7px;color:var(--t2);font-family:var(--mono);white-space:nowrap;}
.ftitle{font-size:11px;color:var(--t0);line-height:1.5;font-weight:400;}
.fdesc{font-size:9px;color:var(--t2);line-height:1.4;margin-top:2px;font-family:var(--mono);}

/* ── CONFLICTS COLUMN ── */
.cf-group-hdr{padding:4px 10px 3px;font-size:7px;font-weight:700;letter-spacing:.9px;
  font-family:var(--mono);border-bottom:1px solid rgba(255,255,255,.05);text-transform:uppercase;}
.cf-item{padding:7px 10px;border-bottom:1px solid var(--b0);cursor:pointer;transition:background .06s;}
.cf-item:hover{background:var(--s1);}
.cf-name{font-size:10px;font-weight:600;color:var(--t0);line-height:1.3;}
.cf-parties{font-size:8px;color:var(--t2);margin-top:2px;font-family:var(--mono);}
.cf-expand{display:none;margin-top:6px;padding-top:6px;border-top:1px solid var(--b0);}
.cf-expand.on{display:block;}
.cf-status-text{font-size:9px;color:var(--t1);line-height:1.5;margin-bottom:5px;}
.cf-meta{font-family:var(--mono);font-size:7px;color:var(--t2);display:flex;gap:8px;}

/* ── MAP MODULE ── */
#mod-map{flex-direction:column;}
#map-container{flex:1;position:relative;}
#map-el{position:absolute;inset:0;}

#map-legend{position:absolute;bottom:28px;left:10px;z-index:10;
  background:rgba(0,0,0,.85);border:1px solid var(--b1);padding:8px 10px;min-width:150px;}
.leg-title{font-family:var(--mono);font-size:7px;letter-spacing:2px;color:var(--t2);
  text-transform:uppercase;margin-bottom:6px;}
.leg-row{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer;transition:opacity .1s;}
.leg-row.off{opacity:.25;}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.leg-label{font-family:var(--mono);font-size:8px;color:var(--t1);flex:1;}
.leg-count{font-family:var(--mono);font-size:7px;color:var(--t2);}

#map-regions{position:absolute;top:10px;right:10px;z-index:10;
  display:flex;flex-wrap:wrap;gap:3px;max-width:280px;}
.reg-btn{background:rgba(0,0,0,.8);border:1px solid var(--b1);color:var(--t1);
  padding:3px 7px;font-size:8px;cursor:pointer;font-family:var(--mono);white-space:nowrap;transition:all .1s;}
.reg-btn:hover{background:rgba(0,0,0,.95);border-color:var(--b2);color:var(--t0);}

#map-filter-modes{position:absolute;bottom:28px;right:10px;z-index:10;display:flex;flex-direction:column;gap:3px;}

#map-stats-bar{height:26px;flex-shrink:0;background:rgba(0,0,0,.9);
  border-top:1px solid var(--b0);display:flex;align-items:center;overflow:hidden;}
.ms-item{display:flex;align-items:center;gap:5px;padding:0 12px;
  border-right:1px solid var(--b0);height:100%;font-family:var(--mono);font-size:7px;color:var(--t2);}
.ms-val{color:var(--t0);margin-left:2px;}

.dark-popup .maplibregl-popup-content{background:#0f0f0f!important;color:#e4e4e7!important;
  padding:0!important;border:1px solid rgba(255,255,255,.15)!important;
  box-shadow:0 8px 32px rgba(0,0,0,.8)!important;border-radius:0!important;}
.dark-popup .maplibregl-popup-close-button{color:#555!important;font-size:16px!important;padding:3px 7px!important;}
.dark-popup .maplibregl-popup-close-button:hover{color:#fff!important;}
.dark-popup .maplibregl-popup-tip{border-top-color:#0f0f0f!important;border-bottom-color:#0f0f0f!important;}

/* ── BREAKING BAR ── */
#breaking-bar{height:22px;flex-shrink:0;background:var(--bg);
  border-top:1px solid var(--b1);display:flex;align-items:center;overflow:hidden;z-index:10;}
.brk-label{flex-shrink:0;padding:0 10px;font-size:7px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;color:#000;background:var(--red);
  height:100%;display:flex;align-items:center;font-family:var(--head);}
.brk-track{flex:1;overflow:hidden;position:relative;height:100%;}
#brk-inner{display:flex;align-items:center;position:absolute;top:0;height:100%;
  white-space:nowrap;animation:brk 90s linear infinite;}
#brk-inner:hover{animation-play-state:paused;}
.brk-item{padding:0 16px;font-size:8px;color:var(--t1);border-right:1px solid var(--b0);
  height:22px;display:inline-flex;align-items:center;cursor:pointer;font-family:var(--mono);}
.brk-item:hover{color:var(--t0);}
.brk-sep{color:var(--b1);padding:0 4px;font-size:7px;}

/* ── SIDE PANELS ── */
#panel-overlay{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.55);display:none;}
.side-panel{position:fixed;top:0;right:0;bottom:0;width:300px;z-index:1201;
  background:#040404;border-left:1px solid var(--b1);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .18s cubic-bezier(.4,0,.2,1);}
.side-panel.open{transform:translateX(0);}
.sp-hdr{height:42px;flex-shrink:0;padding:0 14px;background:var(--bg);
  border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;}
.sp-title{font-family:var(--head);font-size:8px;font-weight:700;letter-spacing:3px;
  color:var(--t1);text-transform:uppercase;flex:1;}
.sp-close{width:24px;height:24px;background:transparent;border:1px solid var(--b1);
  color:var(--t2);font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sp-close:hover{background:var(--b0);color:var(--t0);}
.sp-body{flex:1;overflow-y:auto;padding:14px;}
.sp-section{margin-bottom:16px;}
.sp-label{display:block;font-size:7px;font-weight:700;letter-spacing:1.8px;
  color:var(--t2);text-transform:uppercase;margin-bottom:6px;font-family:var(--mono);}
.sp-input{width:100%;padding:7px 9px;background:var(--b0);border:1px solid var(--b1);
  color:var(--t0);font-size:10px;outline:none;transition:border-color .1s;font-family:var(--mono);}
.sp-input:focus{border-color:var(--b2);}
.sp-btn{width:100%;padding:8px;background:var(--t0);border:none;color:#000;
  font-size:8px;font-weight:700;cursor:pointer;transition:opacity .1s;margin-top:5px;
  font-family:var(--head);letter-spacing:2px;text-transform:uppercase;}
.sp-btn:hover{opacity:.8;}
.sp-btn-ghost{width:100%;padding:7px;background:transparent;border:1px solid var(--b1);
  color:var(--t2);font-size:8px;cursor:pointer;transition:all .1s;margin-top:5px;font-family:var(--mono);}
.sp-btn-ghost:hover{border-color:var(--b2);color:var(--t0);}
.adm-tab{flex:1;padding:9px 4px;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--t2);font-size:9px;cursor:pointer;transition:all .1s;font-family:var(--mono);}
.adm-tab.on{color:var(--t0);border-bottom-color:var(--t0);}
</style>
</head>
<body>
<div id="app">

  <!-- TOPBAR -->
  <div id="topbar">
    <div id="logo"><span class="logo-sq"></span>CONFLICT·TRACKER</div>
    <div class="tb-div"></div>
    <span id="clock">--:--:-- UTC</span>
    <div class="live-badge"><span></span>LIVE</div>
    <div class="tb-div"></div>
    <button class="mod-pill on" onclick="switchModule('feed',this)">FEEDS</button>
    <button class="mod-pill" onclick="switchModule('map',this)">MAP</button>
    <div id="tb-right">
      <span id="last-upd" style="font-family:var(--mono);font-size:7px;color:var(--t2);">—</span>
      <div style="width:1px;height:14px;background:var(--b0);"></div>
      <button class="tb-btn" onclick="doRefresh()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M13 2.5A6.5 6.5 0 1 1 8 1.5"/><path d="M13 2.5V6h-3.5"/></svg>
        SYNC
      </button>
      <button class="tb-btn" onclick="openPanel('admin')" style="border-color:rgba(255,32,32,.25);color:var(--red);">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M8 1l6 3v4c0 4-3 6.5-6 7.5C5 14.5 2 12 2 8V4l6-3z"/></svg>
      </button>
    </div>
  </div>
  <div id="prog"><div id="prog-fill"></div></div>

  <!-- MAIN -->
  <div id="main">

    <!-- ══ MODULE: FEEDS ══ -->
    <div class="module on" id="mod-feed" style="flex-direction:row;">

      <!-- News -->
      <div class="col">
        <div class="col-hdr">
          <div class="ph-dot"></div>
          <span class="col-title">Noticias</span>
          <span class="col-badge" id="ft-media">—</span>
          <span class="col-status" id="cs-media"></span>
        </div>
        <div class="fbar" id="filters-media">
          <button class="fbtn on" onclick="filterFeed('all',this,'media')">ALL</button>
          <button class="fbtn" onclick="filterFeed('conflict',this,'media')">CONFLICT</button>
          <button class="fbtn" onclick="filterFeed('ukraine',this,'media')">UKRAINE</button>
          <button class="fbtn" onclick="filterFeed('mideast',this,'media')">M·EAST</button>
          <button class="fbtn" onclick="filterFeed('africa',this,'media')">AFRICA</button>
          <button class="fbtn" onclick="filterFeed('asia',this,'media')">ASIA</button>
          <button class="fbtn hot" onclick="filterFeed('breaking',this,'media')">⬤ FLASH</button>
        </div>
        <div class="feed" id="feed-media">
          <div class="fstatus"><span class="spin-sq"></span>Aggregating feeds...</div>
        </div>
      </div>

      <!-- OSINT -->
      <div class="col">
        <div class="col-hdr">
          <span class="col-title">OSINT</span>
          <span class="col-badge" id="ft-osint">—</span>
          <span class="col-status" id="cs-osint"></span>
        </div>
        <div class="fbar" id="filters-osint">
          <button class="fbtn on" onclick="filterFeed('all',this,'osint')">ALL</button>
          <button class="fbtn" onclick="filterFeed('ukraine',this,'osint')">UKRAINE</button>
          <button class="fbtn" onclick="filterFeed('mideast',this,'osint')">M·EAST</button>
          <button class="fbtn" onclick="filterFeed('africa',this,'osint')">AFRICA</button>
          <button class="fbtn" onclick="filterFeed('asia',this,'osint')">ASIA</button>
        </div>
        <div class="feed" id="feed-osint">
          <div class="fstatus"><span class="spin-sq"></span>Loading OSINT...</div>
        </div>
      </div>

      <!-- Conflicts -->
      <div class="col" style="width:220px;flex-shrink:0;max-width:220px;">
        <div class="col-hdr">
          <span style="width:6px;height:6px;background:var(--red);display:inline-block;animation:mrkPulse 1.5s ease infinite;flex-shrink:0;"></span>
          <span class="col-title">Conflicts</span>
          <span class="col-badge" id="cf-count">17</span>
        </div>
        <div class="fbar" id="cf-filters">
          <button class="fbtn on" onclick="cfFilter('all',this)">ALL</button>
          <button class="fbtn" onclick="cfFilter('Europa',this)">EU</button>
          <button class="fbtn" onclick="cfFilter('M.Este',this)">ME</button>
          <button class="fbtn" onclick="cfFilter('África',this)">AF</button>
          <button class="fbtn" onclick="cfFilter('Asia',this)">AS</button>
        </div>
        <div class="feed" id="cf-list"></div>
      </div>

    </div><!-- /mod-feed -->

    <!-- ══ MODULE: MAP ══ -->
    <div class="module" id="mod-map">
      <div id="map-container">
        <div id="map-el"></div>
        <div id="map-legend">
          <div class="leg-title">BY CONFLICT</div>
          <div id="map-legend-items"></div>
        </div>
        <div id="map-regions"></div>
        <div id="map-filter-modes">
          <button class="tb-btn on" id="btn-by-conflict" onclick="setMapMode('conflict',this)" style="width:100px;justify-content:center;">BY CONFLICT</button>
          <button class="tb-btn" id="btn-by-type" onclick="setMapMode('type',this)" style="width:100px;justify-content:center;">BY TYPE</button>
        </div>
      </div>
      <div id="map-stats-bar">
        <div class="ms-item">EVENTS <span class="ms-val" id="st-events">—</span></div>
        <div class="ms-item">CONFLICTS <span class="ms-val" id="st-conflicts">—</span></div>
        <div class="ms-item">HIDDEN <span class="ms-val" id="st-hidden">0</span></div>
      </div>
    </div>

  </div><!-- /main -->

  <!-- BREAKING BAR -->
  <div id="breaking-bar">
    <div class="brk-label">BREAKING</div>
    <div class="brk-track">
      <div id="brk-inner"><span class="brk-item" style="color:var(--t2);">Aggregating feeds...</span></div>
    </div>
  </div>

</div><!-- /app -->

<!-- PANEL OVERLAY -->
<div id="panel-overlay" onclick="closePanel()"></div>

<!-- ADMIN PANEL -->
<div class="side-panel" id="panel-admin" style="width:340px;">
  <div class="sp-hdr">
    <span class="sp-title">Admin</span>
    <button class="sp-close" onclick="closePanel()">✕</button>
  </div>
  <div id="admin-login" style="padding:20px;">
    <div style="text-align:center;font-family:var(--mono);font-size:10px;color:var(--t2);padding-bottom:12px;">RESTRICTED ACCESS</div>
    <input id="admin-pwd" type="password" placeholder="Password" class="sp-input"
      onkeydown="if(event.key==='Enter')adminLogin()" style="margin-bottom:8px;"/>
    <button onclick="adminLogin()" class="sp-btn">AUTHENTICATE</button>

// FETCH
// ═══════════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════════
// FETCH ENGINE — sequential proxies, no simultaneous races
// ═══════════════════════════════════════════════════════════

// Concurrency pool

async function pool(tasks, n=6){
  let i=0;
  const run = async()=>{ while(i<tasks.length){const j=i++;try{await tasks[j]();}catch(e){}} };
  await Promise.all(Array.from({length:Math.min(n,tasks.length)},run));
}

async function fetchRSS(url){
  const isRSS = x => x && (x.includes('<item') || x.includes('<entry'));
  const enc   = encodeURIComponent(url);
  const ctrl  = new AbortController();
  const sig   = ctrl.signal;

  const rss = fn => fn().then(x => { if(!isRSS(x)) throw 0; ctrl.abort(); return x; });
  const tf  = (ms, fn) => new Promise((res,rej) => {
    const id = setTimeout(() => rej('to'), ms);
    fn(sig).then(x=>{clearTimeout(id);res(x);}).catch(e=>{clearTimeout(id);rej(e);});
  });
  const after = ms => new Promise(r => setTimeout(r, ms));

  try {
    return await Promise.any([

      // 1. Worker Cloudflare — proxy sin CORS, cacheado 5min — PRIMERO Y SIN DELAY
      rss(() => tf(5000, s =>
        fetch(WORKER+'/rss?url='+enc, {signal:s})
          .then(r => { if(!r.ok) throw 0; return r.text(); })
      )),

      // 2. Directo — feeds con CORS abierto (BBC, Al Jazeera, DW...)
      rss(() => tf(3000, s =>
        fetch(url, {signal:s}).then(r => { if(!r.ok) throw 0; return r.text(); })
      )),

      // 3. corsproxy.io — 400ms delay
      rss(() => after(400).then(() => tf(5000, s =>
        fetch('https://corsproxy.io/?'+enc, {signal:s})
          .then(r => { if(!r.ok) throw 0; return r.text(); })
      ))),

      // 4. rss2json — 700ms delay, convierte JSON→XML
      rss(() => after(700).then(() => tf(6000, s =>
        fetch('https://api.rss2json.com/v1/api.json?rss_url='+enc+'&count=25', {signal:s})
          .then(r => { if(!r.ok) throw 0; return r.json(); })
          .then(j => {
            if(!j.items?.length) throw 0;
            const items = j.items.map(i =>
              '<item><title><![CDATA['+(i.title||'')+']]></title>'+
              '<link>'+(i.link||'')+'</link>'+
              '<pubDate>'+(i.pubDate||'')+'</pubDate>'+
              '<description><![CDATA['+(i.description||i.content||'')+']]></description></item>'
            ).join('');
            return '<rss><channel><title>'+(j.feed?.title||'')+'</title>'+items+'</channel></rss>';
          })
      ))),

    ]);
  } catch(e) { return null; }
}

function parseRSS(xml, src, cat){
  const items = [];

  // Extract text from a tag — strips all HTML, CDATA, entities
  const get = (b, tag) => {
    const m = b.match(new RegExp(`<${tag}[^>]*>([\\s\\S]*?)<\\/${tag}>`, 'i'));
    if(!m) return '';
    return m[1]
      .replace(/<!\[CDATA\[/gi, '').replace(/\]\]>/gi, '') // CDATA
      .replace(/<[^>]+>/g, ' ')                            // strip tags
      .replace(/&lt;[^&]*&gt;/g, '')                       // encoded tags
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&nbsp;/g,' ')
      .replace(/\s+/g, ' ').trim();
  };

  // Clean desc — remove any remaining html-like junk, truncate cleanly
  const cleanDesc = raw => {
    if(!raw) return '';
    // Strip anything that looks like html attribute junk
    let s = raw.replace(/\w+=["'][^"']*["']/g, '').replace(/\s+/g,' ').trim();
    if(s.length < 20) return ''; // too short to be useful
    return s.slice(0, 160);
  };

  let re = /<item[^>]*>([\s\S]*?)<\/item>/gi, m;
  while((m=re.exec(xml))!==null){
    const b=m[1], title=get(b,'title').slice(0,180); if(!title) continue;
    const link=get(b,'link')||get(b,'guid');
    const pubDate=get(b,'pubDate')||get(b,'dc:date')||new Date().toUTCString();
    const desc=cleanDesc(get(b,'description'));
    items.push({title,link,pubDate,desc,src,cat:cat==='general'?classify(title):cat,type:'rss'});
  }
  if(!items.length){
    re = /<entry[^>]*>([\s\S]*?)<\/entry>/gi;
    while((m=re.exec(xml))!==null){
      const b=m[1], title=get(b,'title').slice(0,180); if(!title) continue;
      const link=(b.match(/<link[^>]+href="([^"]+)"/)||[])[1]||'';
      const pubDate=get(b,'published')||get(b,'updated')||new Date().toUTCString();
      const desc=cleanDesc(get(b,'summary')||get(b,'content'));
      items.push({title,link,pubDate,desc,src,cat:cat==='general'?classify(title):cat,type:'rss'});
    }
  }
  return items;
}

function itemHTML(item){
  const cat = item.type==='tg' ? 'tg' : classify(item.title);
  const [tcls,tlbl] =
    item.type==='twitter' ? ['tag-tw','𝕏 OSINT'] :
    item.type==='gdelt'   ? ['tag-gd','GDELT']   :
    item.type==='osint'   ? ['tag-tg','OSINT']   :
    (TAG_MAP[cat]||TAG_MAP.general);
  const href = (item.link||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const isRead = readSet.has(item.link||'');
  const si = JSON.stringify({title:item.title,link:item.link,src:item.src,pubDate:item.pubDate}).replace(/"/g,'&quot;');
  return `<div class="fitem${isRead?' read':''}${item._new?' isnew':''}" ${href?`onclick="openItem('${href}')"`:''}><div class="ftop">
    <span class="ftag ${tcls}">${tlbl}</span>
    <span class="fsrc">${item.src}</span>
    <span class="ftime">${timeAgo(item.pubDate)}</span>
    <div class="fitem-btns">
      ${href?`<button class="ibtn rbtn${isRead?' read-on':''}" onclick="event.stopPropagation();toggleRead(this,'${href}')" title="Marcar leída">◉</button>`:''}
      ${href?`<button class="ibtn" onclick="event.stopPropagation();saveItem(${si})" title="Guardar">🔖</button>`:''}
    </div>
  </div>
  <div class="ftitle">${item.title.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
  ${item.desc?`<div class="fdesc">${item.desc.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`:''}
  </div>`;
}

function renderFeed(items, feedId){
  const el = document.getElementById(feedId); if(!el) return;
  const filt = feedId==='feed-media' ? activeCatMedia : activeCatOsint;
  let filtered = items;
  if(filt!=='all'){
    if(filt==='breaking') filtered = items.filter(i=>KEYWORDS.breaking.test(i.title));
    else filtered = items.filter(i=>(i.cat||'')==filt||(KEYWORDS[filt]&&KEYWORDS[filt].test(i.title)));
  }
  if(!filtered.length){
    el.innerHTML='<div class="fstatus">Sin resultados para este filtro.</div>'; return;
  }
  // Build in fragment then swap — preserves scroll, no flash
  const scrollTop = el.scrollTop;
  const frag = document.createDocumentFragment();
  const badge = el.querySelector('.nbadge');
  if(badge) frag.appendChild(badge.cloneNode(true));
  filtered.forEach(item => {
    const d = document.createElement('div');
    d.innerHTML = itemHTML(item);
    if(d.firstChild) frag.appendChild(d.firstChild);
  });
  el.innerHTML = '';
  el.appendChild(frag);
  el.scrollTop = scrollTop;
}

function filterFeed(f, btn, which){


  if(which==='media') activeCatMedia=f; else activeCatOsint=f;
  btn.closest('.filters').querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(which==='media') renderFeed(mediaCache.data, 'feed-media');
  else renderFeed(osintCache.data, 'feed-osint');
}

async function loadMedia(){
  colStatus('media','loading');
  const srcs=[...MEDIA_SOURCES,...customSources];
  let done=0, firstRender=false;
  const all=[];
  const isFirst=!mediaCache.data.length;

  await pool(srcs.map(src=>async()=>{
    const xml = await fetchRSS(src.url);
    if(xml){
      parseRSS(xml,src.n,src.cat).forEach(i=>all.push(i));
      // Show first results as soon as 5+ items arrive — don't wait for all sources
      if(isFirst && !firstRender && all.length >= 5){
        firstRender=true;
        sortByDate(all);
        mediaCache={ts:Date.now(),data:[...all]};
        renderFeed(all,'feed-media');
        colStatus('media','ok',all.length+' items');
        const e=document.getElementById('ft-media'); if(e) e.textContent=all.length;
      }
    }
    done++;
    progSet(Math.round((done/srcs.length)*50));
  }),15);

  sortByDate(all);
  if(!all.length){
    if(isFirst) document.getElementById('feed-media').innerHTML='<div class="fstatus">Sin resultados. Comprueba tu conexión.</div>';
    colStatus('media','err'); return;
  }
  if(isFirst){
    mediaCache={ts:Date.now(),data:all};
    renderFeed(all,'feed-media');
  } else {
    const {merged,newCount}=merge(mediaCache.data,all);
    mediaCache={ts:Date.now(),data:merged};
    if(newCount) prependNew(merged.slice(0,newCount),'feed-media');
    else renderFeed(merged,'feed-media');
  }
  const e=document.getElementById('ft-media'); if(e) e.textContent=mediaCache.data.length;
  colStatus('media','ok',mediaCache.data.length+' items');
  syncMobBadges();
}

async function loadOSINT(){
  colStatus('osint','loading');
  let done=0;
  const all=[];
  const isFirst=!osintCache.data.length;
  let firstRender=false;
  await pool(OSINT_SOURCES.map(src=>async()=>{
    const xml=await fetchRSS(src.url);
    if(xml){
      const items = parseRSS(xml,src.n,src.cat);
      items.forEach(i=>{i.type='osint';all.push(i);});
      if(isFirst && !firstRender && all.length >= 3){
        firstRender = true;
        sortByDate(all);
        osintCache={ts:Date.now(),data:[...all]};
        renderFeed(all,'feed-osint');
        colStatus('osint','ok', all.length+' items');
      }
    }
    done++;
    progSet(50+Math.round((done/OSINT_SOURCES.length)*50));
  }),10);
  sortByDate(all);
  if(!all.length&&isFirst){
    document.getElementById('feed-osint').innerHTML='<div class="fstatus">Sin datos OSINT disponibles.</div>';
    colStatus('osint','err'); return;
  }
  if(isFirst){
    osintCache={ts:Date.now(),data:all};
    renderFeed(all,'feed-osint');
  } else {
    const {merged,newCount}=merge(osintCache.data,all);
    osintCache={ts:Date.now(),data:merged};
    if(newCount) prependNew(merged.slice(0,newCount),'feed-osint');
    else renderFeed(merged,'feed-osint');
  }
  const e=document.getElementById('ft-osint'); if(e) e.textContent=osintCache.data.length;
  colStatus('osint','ok',osintCache.data.length+' items');
  progSet(100);
}

async function loadBreakingBar(){
  // Reuse media cache if available — no extra fetches
  if(brkLoaded&&mediaCache.data.length){ _renderBreakingBar(mediaCache.data); return; }
  const all=[];
  await pool(BREAKING_RSS.map(url=>async()=>{
    const xml=await fetchRSS(url); if(!xml) return;
    parseRSS(xml,'','general').slice(0,10).forEach(i=>all.push(i));
  }),3);
  sortByDate(all);
  if(all.length){ brkLoaded=true; _renderBreakingBar(all); }
}

function openItem(href){ window.open(href,'_blank'); markRead(href); }

function timeAgo(d){
  if(!d) return '';
  const s = Math.floor((Date.now()-new Date(d))/1000);
  if(s<60) return s+'s';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  return Math.floor(s/86400)+'d';
}

function markRead(href){
  if(!href) return;
  readSet.add(href);
  try{ localStorage.setItem('ct_read', JSON.stringify([...readSet].slice(-500))); }catch(e){}
  // Visually mark
  document.querySelectorAll('.fitem').forEach(el => {
    if(el.getAttribute('onclick')?.includes(href)) el.classList.add('read');
  });
}

function merge(existing, incoming){
  const seen = new Set(existing.map(i => i.link||i.title));
  const fresh = incoming.filter(i => { const k=i.link||i.title; return k&&!seen.has(k); });
  fresh.forEach(i => i._new=true);
  return { merged: sortByDate([...fresh,...existing]).slice(0,400), newCount: fresh.length };
}

function renderConflicts(){
  const list = document.getElementById('cf-list');
  const cnt  = document.getElementById('cf-count');
  const upd  = document.getElementById('cf-updated');
  if(!list) return;

  const data = _cfFilter === 'all'
    ? CONFLICTS
    : CONFLICTS.filter(c => c.region === _cfFilter);

  if(cnt) cnt.textContent = data.length + ' ACT';

  // Group by intensity
  const byInt = {3:[], 2:[], 1:[]};
  data.forEach(c => (byInt[c.intensity]||byInt[1]).push(c));

  let html = '';
  [3,2,1].forEach(i => {
    if(!byInt[i].length) return;
    const {label, col} = CF_INTENSITY[i];
    html += `<div style="padding:5px 10px 3px;font-size:8px;font-weight:700;
      letter-spacing:.9px;color:${col};font-family:var(--mono);
      border-bottom:1px solid rgba(255,255,255,.05);
      background:rgba(${i===3?'232,68,90':i===2?'240,168,50':'77,140,245'},.06);">
      ${label} · ${byInt[i].length}
    </div>`;
    byInt[i].forEach(cf => {
      const {dot, pulse} = CF_INTENSITY[cf.intensity];
      html += `<div class="cf-item" onclick="cfExpand('${cf.id}')"
        style="padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.04);
        cursor:pointer;transition:background .12s;"
        onmouseover="this.style.background='rgba(255,255,255,.04)'"
        onmouseout="this.style.background=''">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px;">
          <span style="width:6px;height:6px;border-radius:50%;background:${dot};
            flex-shrink:0;box-shadow:0 0 5px ${dot};
            ${pulse?'animation:mrkPulse 1.5s ease infinite;':''}"></span>
          <span style="font-size:11px;font-weight:600;color:rgba(255,255,255,.9);
            line-height:1.3;flex:1;">${cf.name}</span>
        </div>
        <div style="font-size:9px;color:var(--t2);margin-left:13px;line-height:1.4;">
          ${cf.parties}
        </div>
        <div id="cf-expand-${cf.id}" style="display:none;margin-top:7px;margin-left:13px;">
          <div style="font-size:10px;color:rgba(255,255,255,.7);line-height:1.5;
            margin-bottom:5px;">${cf.status}</div>
          <div style="display:flex;gap:8px;font-size:8px;font-family:var(--mono);">
            <span style="color:var(--t2);">📅 ${cf.since}</span>
            <span style="color:var(--red);">☠ ${cf.deaths}</span>
          </div>
        </div>
      </div>`;
    });
  });

  list.innerHTML = html;
  if(upd){
    const now = new Date();
    upd.textContent = now.toLocaleDateString('es',{month:'short',year:'numeric'}).toUpperCase();
  }
}

async function adminPublish(){
  const btn = document.getElementById('admin-publish-btn');
  const resetBtn = () => {
    if(btn){ btn.disabled=false; btn.innerHTML='&#8593; Publicar cambios'; }
  };

  if(btn){ btn.disabled=true; btn.innerHTML='<span style="opacity:.6">Publicando...</span>'; }

  if(!ADMIN_SECRET){
    document.getElementById('admin-jsonbin-setup').style.display = 'block';
    _showSyncStatus('⚠ ADMIN_SECRET no configurado', 'var(--amb)');
    resetBtn(); return;
  }

  try{
    const data = _getConflicts();
    const ok = await _saveConflicts(data);
    _showSyncStatus(
      ok ? '✓ Publicado — '+data.length+' conflictos en GitHub' : '✗ Error — revisa la consola (F12)',
      ok ? 'var(--grn)' : 'var(--red)'
    );
  }catch(e){
    console.error('adminPublish error:', e);
    _showSyncStatus('✗ Error: '+e.message, 'var(--red)');
  } finally {
    resetBtn();
  }
}

function _showSyncStatus(msg, col){
  col = col || 'var(--grn)';
  const el = document.getElementById('admin-sync-status');
  if(!el) return;
  el.textContent = msg;
  el.style.color = col;
  setTimeout(() => { if(el.textContent===msg) el.textContent=''; }, 5000);
}

async function _getConflictsAsync(){
  // 1. Worker GET /conflicts — sin auth, datos en GitHub via Worker
  try{
    const r = await fetch(WORKER_CONFLICTS_GET + '?t=' + Math.floor(Date.now()/60000),
      { signal: AbortSignal.timeout(5000) });
    if(r.ok){
      const data = await r.json();
      if(Array.isArray(data) && data.length){
        localStorage.setItem(SK_CONFLICTS, JSON.stringify(data));
        return data;
      }
    }
  }catch(e){}
  // 2. localStorage
  const raw = localStorage.getItem(SK_CONFLICTS);
  if(raw){ try{ const d=JSON.parse(raw); if(d.length) return d; }catch(e){} }
  // 3. Hardcoded defaults
  return [];
}

function _getConflicts(){
  const raw = localStorage.getItem(SK_CONFLICTS);
  if(raw) try{ return JSON.parse(raw); }catch(e){}
  return [];
}

async function _saveConflicts(data){
  localStorage.setItem(SK_CONFLICTS, JSON.stringify(data));
  if(!ADMIN_SECRET){
    console.warn('ADMIN_SECRET not set — saved locally only');
    return true;
  }
  try{
    const res = await fetch(WORKER_CONFLICTS_PUT, {
      method: 'PUT',
      headers:{
        'Content-Type': 'application/json',
        'X-Admin-Secret': ADMIN_SECRET,
      },
      body: JSON.stringify(data),
      signal: AbortSignal.timeout(12000),
    });
    if(res.ok){
      console.log('✓ conflicts.json publicado via Worker');
      return true;
    }
    const err = await res.json().catch(() => ({}));
    console.error('Worker PUT error:', res.status, err);
    _showSyncStatus('✗ Error '+res.status+': '+(err.error||''), 'var(--red)');
    return false;
  }catch(e){
    console.error('Worker exception:', e);
    _showSyncStatus('✗ Error de red: '+e.message, 'var(--red)');
    return false;
  }
}

async function _pollRemoteConflicts(){
  if(_adminAuthed) return;
  try{
    const r = await fetch(WORKER_CONFLICTS_GET + '?t=' + Math.floor(Date.now()/60000), {
      signal: AbortSignal.timeout(6000),
    });
    if(!r.ok) return;
    const data = await r.json();
    if(!Array.isArray(data)) return;
    if(!Array.isArray(data) || !data.length) return;
    const current = JSON.stringify(_conflicts);
    if(JSON.stringify(data) !== current){
      _conflicts = data;
      localStorage.setItem(SK_CONFLICTS, JSON.stringify(data));
      _drawConflicts();
    }
  }catch(e){}
}

let _map=null,_mapMarkers=[],_mapMode='conflict',_mapHidden=new Set();
function initMap(){
  if(_map)return; const e=document.getElementById('map-el');if(!e)return;
  _map=new maplibregl.Map({container:e,style:{version:8,sources:{carto:{type:'raster',tiles:['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],tileSize:256,attribution:'© CARTO © OSM'}},layers:[{id:'carto',type:'raster',source:'carto'}]},center:[20,15],zoom:2});
  _map.addControl(new maplibregl.NavigationControl(),'bottom-right');
  _map.on('load',()=>{drawMapEvents();buildMapLegend();buildMapRegions();});
}
function drawMapEvents(){
  if(!_map)return; _mapMarkers.forEach(m=>m.remove());_mapMarkers=[];
  const palette=_mapMode==='conflict'?EVENT_CONFLICTS:EVENT_TYPES;
  const key=_mapMode==='conflict'?'conflict':'type';
  const visible=MAP_EVENTS.filter(e=>!_mapHidden.has(e[key]));
  document.getElementById('st-events').textContent=MAP_EVENTS.length;
  document.getElementById('st-conflicts').textContent=Object.keys(EVENT_CONFLICTS).length;
  document.getElementById('st-hidden').textContent=MAP_EVENTS.length-visible.length;
  visible.forEach(evt=>{
    const color=palette[evt[key]]||'#ffffff';
    const marker=new maplibregl.Marker({color,scale:0.65}).setLngLat([evt.lng,evt.lat])
      .setPopup(new maplibregl.Popup({closeButton:true,maxWidth:'300px',className:'dark-popup'})
        .setHTML(`<div style="font-family:monospace;font-size:11px;background:#0f0f0f;color:#e4e4e7;padding:10px 12px;line-height:1.5;">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;"><span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;"></span><strong>${evt.type}</strong></div>
          <div style="color:#a1a1aa;font-size:10px;">${evt.conflict} · ${evt.date}</div>
          <div style="color:#d4d4d8;margin-top:3px;">${evt.location}</div>
          <div style="color:#a1a1aa;font-size:10px;">${evt.description}</div>
          ${evt.casualties?`<div style="color:#f87171;font-size:10px;margin-top:3px;">⚠ ${evt.casualties}</div>`:''}
        </div>`)).addTo(_map);
    const mEl=marker.getElement();mEl.style.cursor='pointer';
    mEl.addEventListener('mouseenter',()=>{mEl.style.filter=`drop-shadow(0 0 8px ${color})`;});
    mEl.addEventListener('mouseleave',()=>{mEl.style.filter='none';});
    _mapMarkers.push(marker);
  });
}
function buildMapLegend(){
  const palette=_mapMode==='conflict'?EVENT_CONFLICTS:EVENT_TYPES;
  const key=_mapMode==='conflict'?'conflict':'type';
  const el=document.getElementById('map-legend-items');if(!el)return;
  el.innerHTML=Object.entries(palette).map(([k,col])=>{
    const cnt=MAP_EVENTS.filter(e=>e[key]===k).length;const off=_mapHidden.has(k);
    return `<div class="leg-row${off?' off':''}" onclick="toggleMapKey('${k}')"><div class="leg-dot" style="background:${col};${off?'':'box-shadow:0 0 4px '+col}"></div><span class="leg-label">${k}</span><span class="leg-count">${cnt}</span></div>`;
  }).join('');
}
function buildMapRegions(){
  const el=document.getElementById('map-regions');if(!el)return;
  el.innerHTML=MAP_REGIONS.map(r=>`<button class="reg-btn" onclick="_map.flyTo({center:[${r.center}],zoom:${r.zoom},duration:1500})">${r.label}</button>`).join('');
}
function toggleMapKey(k){if(_mapHidden.has(k))_mapHidden.delete(k);else _mapHidden.add(k);drawMapEvents();buildMapLegend();}
function setMapMode(mode,btn){_mapMode=mode;_mapHidden.clear();document.querySelectorAll('#map-filter-modes .tb-btn').forEach(x=>x.classList.remove('on'));btn.classList.add('on');const t=document.querySelector('#map-legend .leg-title');if(t)t.textContent=mode==='conflict'?'BY CONFLICT':'BY TYPE';drawMapEvents();buildMapLegend();}


function switchModule(name,btn){document.querySelectorAll('.module').forEach(m=>m.classList.remove('on'));document.querySelectorAll('.mod-pill').forEach(x=>x.classList.remove('on'));const mod=document.getElementById('mod-'+name);if(mod)mod.classList.add('on');btn.classList.add('on');if(name==='map'&&!_map)initMap();}
function openPanel(id){document.getElementById('panel-overlay').style.display='block';document.querySelectorAll('.side-panel').forEach(p=>p.classList.remove('open'));const p=document.getElementById('panel-'+id);if(p)p.classList.add('open');}
function closePanel(){document.getElementById('panel-overlay').style.display='none';document.querySelectorAll('.side-panel').forEach(p=>p.classList.remove('open'));}
function progSet(pct){const fill=document.getElementById('prog-fill'),bar=document.getElementById('prog');if(!fill||!bar)return;bar.classList.remove('idle');fill.style.width=pct+'%';if(pct>=100)setTimeout(()=>{bar.classList.add('idle');setTimeout(()=>{bar.classList.remove('idle');fill.style.width='0%';},700);},200);}
function colStatus(id,state,text=''){const el=document.getElementById('cs-'+id);if(!el)return;if(state==='loading')el.innerHTML='<span class="spin-sq"></span>';else if(state==='ok')el.innerHTML='<span style="color:var(--grn)">✓</span>'+(text?' '+text:'');else if(state==='err')el.innerHTML='<span style="color:var(--red)">✗</span>';else el.innerHTML='';}
function setLastUpdated(){const el=document.getElementById('last-upd');if(el)el.textContent=new Date().toISOString().slice(11,16)+' UTC';}
function doRefresh(){mediaCache={ts:0,data:[]};osintCache={ts:0,data:[]};loadMedia();loadOSINT();}
function updateBreakingBar(items){if(!items||!items.length)return;const h=items.map(x=>`<span class="brk-item" onclick="openItem('${x.link}')">${x.title}</span><span class="brk-sep">◆</span>`).join('');const el=document.getElementById('brk-inner');if(el)el.innerHTML=h+h;}

function admTab(t,btn){document.querySelectorAll('.adm-tab').forEach(x=>x.classList.remove('on'));btn.classList.add('on');}
function adminLogin(){const pwd=document.getElementById('admin-pwd')?.value||'';crypto.subtle.digest('SHA-256',new TextEncoder().encode(pwd)).then(buf=>{const hex=[...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');if(hex===ADMIN_PWD_HASH){document.getElementById('admin-login').style.display='none';document.getElementById('admin-workspace').style.display='flex';}else{const e=document.getElementById('admin-err');if(e)e.style.display='block';setTimeout(()=>{if(e)e.style.display='none';},2000);}});}


function startClock(){
  const el = document.getElementById('clock');
  setInterval(()=>{
    const n=new Date();
    if(el) el.textContent =
      String(n.getUTCHours()).padStart(2,'0')+':'+
      String(n.getUTCMinutes()).padStart(2,'0')+':'+
      String(n.getUTCSeconds()).padStart(2,'0')+' UTC';
  },1000);
}

function loadPrefs(){
  const font = localStorage.getItem('ct_font');
  if(font) applyFont(font);
  const size = localStorage.getItem('ct_size');
  if(size) applySize(size);
  const accent = localStorage.getItem('ct_accent');
  if(accent){
    document.documentElement.style.setProperty('--blue', accent);
    document.querySelectorAll('.cdot').forEach(d => {
      if(d.style.background===accent||d.getAttribute('onclick')?.includes(accent)){
        d.classList.add('on');
      } else d.classList.remove('on');
    });
  }
  if(localStorage.getItem('ct_theme')==='light'){
    document.body.classList.add('light');
    const tog=document.getElementById('tog-dark'); if(tog) tog.classList.remove('on');
  }
}

function applyFont(v){
  // v is the raw option value e.g. "Inter" or "'JetBrains Mono'"
  document.documentElement.style.setProperty('--font', v + ',sans-serif');
  localStorage.setItem('ct_font', v);
  const s = document.getElementById('pref-font');
  if(s) s.value = v;
}

function applySize(v){
  v = parseInt(v);
  document.documentElement.style.fontSize = v+'px';
  const sv = document.getElementById('size-val'); if(sv) sv.textContent=v+'px';
  const sl = document.getElementById('pref-size'); if(sl) sl.value=v;
  localStorage.setItem('ct_size', v);
}

function setLastUpdated(){
  const el=document.getElementById('last-updated'); if(!el) return;
  const n=new Date();
  el.textContent='Actualizado '+String(n.getUTCHours()).padStart(2,'0')+':'+String(n.getUTCMinutes()).padStart(2,'0')+' UTC';
}

function startAutoRefresh(){
  const INTERVAL=5*60*1000;
  let lastRun=Date.now();
  function schedule(){
    const wait=Math.max(0,INTERVAL-(Date.now()-lastRun));
    setTimeout(async()=>{
      if(!document.hidden){lastRun=Date.now();await refreshAll();}
      schedule();
    },wait);
  }
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden&&Date.now()-lastRun>INTERVAL){lastRun=Date.now();refreshAll();}
  });
  schedule();
}

function init(){
  loadPrefs(); startClock(); renderConflicts(); progSet(2);
  setTimeout(async()=>{
    await Promise.all([loadMedia(),loadOSINT()]);
    setLastUpdated(); setTimeout(loadBreakingBar,400);
  },200);
  startAutoRefresh();
  setInterval(_pollRemoteConflicts,300000);
}
document.addEventListener('DOMContentLoaded',init);
